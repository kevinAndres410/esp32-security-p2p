[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Equivalente a "USB CDC On Boot: Enabled" del Arduino IDE.
; Necesario en la mayoría de módulos ESP32-C3 Mini (usan USB nativo,
; no chip puente USB-UART). Si el monitor serial no muestra nada,
; este es el primer valor a revisar.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
